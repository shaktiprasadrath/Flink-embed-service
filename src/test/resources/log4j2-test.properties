# Keep Flink's own logging quiet so the demo output (result tables) is readable.
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = console

logger.demo.name = com.shakti.flinkdemo
logger.demo.level = INFO

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %c{1} - %msg%n

# Harmless warnings in an embedded (non-cluster) setup, e.g. on Windows. Hidden to keep output clean.
logger.metricutils.name = org.apache.flink.runtime.metrics.util.MetricUtils
logger.metricutils.level = ERROR
logger.webmonitor.name = org.apache.flink.runtime.webmonitor.WebMonitorUtils
logger.webmonitor.level = ERROR
logger.tokens.name = org.apache.flink.runtime.security.token.DefaultDelegationTokenManager
logger.tokens.level = ERROR
logger.metricgroup.name = org.apache.flink.metrics.MetricGroup
logger.metricgroup.level = ERROR
